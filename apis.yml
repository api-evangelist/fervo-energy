name: Fervo Energy
description: >-
  Fervo Energy is a next-generation geothermal power company headquartered in
  Houston, Texas, that generates carbon-free, always-on electricity through
  enhanced geothermal systems (EGS). Founded in 2017 by Tim Latimer and Jack
  Norbeck, Fervo adapts horizontal drilling, distributed fiber-optic sensing,
  and advanced subsurface data analytics from the oil and gas industry to make
  geothermal energy viable in previously uneconomic locations. Its projects
  include the Project Red pilot in Nevada and the flagship 500 MW Cape Station
  development in Beaver County, Utah. Fervo trades on Nasdaq under the ticker
  FRVO and is backed by investors including DCVC. This is a company profile in
  the API Evangelist network surfaced from the DCVC portfolio; Fervo Energy is a
  physical energy-infrastructure company and publishes no public developer API,
  SDK, or documentation surface.
